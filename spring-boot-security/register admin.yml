info:
  name: register admin
  type: http

http:
  method: POST
  url: http://localhost:8080/api/auth/register
  body:
    type: json
    data: |-
      {
        "name" : "chrisadmin",
        "password": "password",
        "email" : "chrisadmin@simplon.co",
        "authorities": [{
          "authority": "ROLE_ADMIN"
        }]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
